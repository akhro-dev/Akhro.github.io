<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Axrorbek Abdilvosiyev — IT portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f7; --surface:#ffffff; --ink:#14213d; --muted:#56607a; --line:#cdd6e4; --accent:#1f4bd8; --accent-ink:#ffffff; --mark:#ffe58a;
  --head:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1626;--surface:#17203a;--ink:#e8edf8;--muted:#9aa6c2;--line:#2a3658;--accent:#7c9bff;--accent-ink:#0f1626;--mark:#6b5a12;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f1626;--surface:#17203a;--ink:#e8edf8;--muted:#9aa6c2;--line:#2a3658;--accent:#7c9bff;--accent-ink:#0f1626;--mark:#6b5a12;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body)}
.wrap{max-width:820px;margin:0 auto;padding:48px 20px 64px}
h1{font:800 clamp(2.4rem,7vw,4rem)/1.02 var(--head);letter-spacing:-.02em;margin:0 0 12px}
.lead{color:var(--muted);max-width:56ch;margin:0 0 32px}
.search{position:relative}
.search input{width:100%;font:500 clamp(1.1rem,3vw,1.4rem) var(--head);padding:20px 56px 20px 20px;border:2px solid var(--ink);border-radius:6px;background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--muted);font-weight:500}
.search input:focus-visible,.chip:focus-visible,a:focus-visible,.theme:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.search kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:500 .8rem var(--body);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
.chip{font:500 .95rem var(--body);padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);font-size:.9rem;margin:0 0 20px;min-height:1.4em}
.list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:18px 20px}
.item h3{font:700 1.2rem/1.25 var(--head);margin:0 0 2px}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.item p{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:.82rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 8px}
.item a{color:var(--accent);font-weight:500}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.empty{padding:32px 0;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;color:var(--muted);font-size:.95rem}
.theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 12px;font:500 .9rem var(--body);cursor:pointer}
footer{margin-top:48px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.item{animation:in .25s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>Toshkent, Yunusobod tumani</span><button class="theme" id="theme" type="button">Rejim</button></div>
  <h1>Axrorbek Abdilvosiyev</h1>
  <p class="lead">239-maktab 11-A sinf oʻquvchisi, dasturlashni oʻrganayotgan abituriyent. Menga oid hamma narsa shu yerda: qidiruvga kerakli soʻzni yozing, masalan «Python», «olimpiada» yoki «telegram».</p>

  <div class="search">
    <input id="q" type="search" placeholder="Nima izlayapsiz?" aria-label="Sayt ichidan qidirish" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Boʻlimlar"></div>
  <p class="count" id="count" aria-live="polite"></p>
  <ul class="list" id="list"></ul>

  <footer>Oxirgi yangilanish: 2026-yil oktyabr</footer>
</div>

<script>
/* ====== SHU YERNI OʻZINGIZGA MOSLAB TAHRIRLANG ======
   cat: boʻlim nomi, title: sarlavha, meta: sana/joy, text: tavsif,
   tags: kalit soʻzlar, link: ixtiyoriy havola */
const DATA = [
  {cat:"Men haqimda", title:"Qisqacha tanishuv", meta:"2009-yil 13-noyabrda tugʻilganman", text:"Men Axrorbek Abdilvosiyev, 16 yoshdaman. Toshkent shahri, Yunusobod tumani, 239-maktabning 11-A sinfida oʻqiyman. IT sohasiga qiziqaman va dasturlashni oʻzim mustaqil oʻrganyapman.", tags:["tanishuv","haqimda","Yunusobod","Toshkent"]},
  {cat:"Taʼlim", title:"239-maktab, 11-A sinf", meta:"Yunusobod tumani, Toshkent · hozirgi kunda", text:"Maktabimizda 10 ballik tizim qoʻllanadi. Baholarim yaxshi: 8, 9 va 10 baho olaman (bu 5 ballik tizimda taxminan 4–5 ga teng). Bu yil maktabda informatika fanidan olimpiadada ishtirok etyapman.", tags:["maktab","239-maktab","baho","informatika","11-sinf"]},
  {cat:"Koʻnikmalar", title:"Hozir oʻrganayotganlarim", meta:"", text:"Python dasturlash tili va frontend (HTML, CSS, JavaScript) asoslarini oʻrganyapman.", tags:["Python","frontend","HTML","CSS","JavaScript","dasturlash"]},
  {cat:"Koʻnikmalar", title:"Oʻrganishni rejalashtirganlarim", meta:"kelgusi yillar", text:"C++, Java, JavaScript va backend dasturlash. Maqsadim bitta tilda toʻxtab qolmay, turli yoʻnalishlarni chuqur bilish.", tags:["C++","Java","JavaScript","backend","reja"]},
  {cat:"Loyihalar", title:"Shaxsiy portfolio saytim", meta:"2026 · HTML, CSS, JavaScript", text:"Oʻzim haqimdagi maʼlumotlarni bir joyga toʻplagan va ichidan qidirish mumkin boʻlgan sayt. Aynan shu sahifa.", tags:["sayt","frontend","HTML","CSS","JavaScript","portfolio"]},
  {cat:"Loyihalar", title:"Yaqin rejalarim", meta:"2026–2027", text:"Hozircha katta loyihalarim yoʻq, lekin yaqin kelajakda Python va veb texnologiyalarida bir nechta amaliy loyiha qilmoqchiman va ularni GitHub'ga joylayman.", tags:["reja","loyiha","GitHub","Python"]},
  {cat:"Yutuqlar", title:"Informatika olimpiadasi", meta:"2026–2027 oʻquv yili · maktab bosqichi", text:"Bu yil maktabimizda informatikadan olimpiadada qatnashyapman va gʻolib boʻlishni maqsad qilganman. Natijalar chiqqach shu yerga qoʻshaman.", tags:["olimpiada","informatika","tanlov","maqsad"]},
  {cat:"Maqsadlar", title:"Kelajak rejalarim", meta:"", text:"Universitetda IT yoʻnalishida oʻqib, C++, Java va backend boʻyicha chuqur bilim olish hamda real loyihalarda ishlash.", tags:["maqsad","kelajak","universitet","IT"]},
  {cat:"Aloqa", title:"Bogʻlanish", meta:"", text:"Email: 11axa132009@gmail.com · Telegram: @A_A_R_11", tags:["email","telegram","aloqa","kontakt","gmail"], link:"https://t.me/A_A_R_11"}
];

const $ = s => document.querySelector(s);
const cats = ["Hammasi", ...new Set(DATA.map(d => d.cat))];
let active = "Hammasi";

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().replace(/[ʻʼ’'`‘]/g, "");
function hl(text, q){
  const t = esc(text);
  if(!q) return t;
  const re = new RegExp("(" + q.split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")", "gi");
  return t.replace(re, "<mark>$1</mark>");
}

function render(){
  const q = $("#q").value.trim();
  const words = norm(q).split(/\s+/).filter(Boolean);
  const res = DATA.filter(d => {
    if(active !== "Hammasi" && d.cat !== active) return false;
    const hay = norm([d.cat, d.title, d.meta, d.text, d.tags.join(" ")].join(" "));
    return words.every(w => hay.includes(w));
  });
  $("#count").textContent = q || active !== "Hammasi" ? res.length + " ta natija topildi" : "";
  $("#list").innerHTML = res.length ? res.map(d => `
    <li class="item">
      <h3>${hl(d.title,q)}</h3>
      <p class="meta">${esc(d.cat)}${d.meta ? " · " + hl(d.meta,q) : ""}</p>
      <p>${hl(d.text,q)}</p>
      ${d.link ? `<p><a href="${esc(d.link)}" target="_blank" rel="noopener">Ochish</a></p>` : ""}
      <div class="tags">${d.tags.map(t => `<span class="tag">${hl(t,q)}</span>`).join("")}</div>
    </li>`).join("") : `<li class="empty">Hech narsa topilmadi. Boshqa soʻz yozing yoki «Hammasi» boʻlimini tanlang.</li>`;
}

function renderChips(){
  $("#chips").innerHTML = cats.map(c => `<button class="chip" type="button" aria-pressed="${c===active}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  active = b.dataset.c; renderChips(); render();
});
$("#q").addEventListener("input", render);
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
});
$("#theme").addEventListener("click", () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
});
renderChips(); render();
</script>
</body>
</html>
