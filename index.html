let lang="uz",active="all";
try{const s=localStorage.getItem("lang");if(s&&UI[s])lang=s;else $("#pick").hidden=false}catch(e){$("#pick").hidden=false}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().replace(/[ʻʼ’'`‘]/g,"");
function hl(t,q){t=esc(t);if(!q)return t;const w=q.split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));return w.length?t.replace(new RegExp("("+w.join("|")+")","gi"),"<mark>$1</mark>"):t}
function texts(){const u=UI[lang];$("#loc").textContent=u.loc;$("#lead").textContent=u.lead;$("#q").placeholder=u.ph;$("#q").setAttribute("aria-label",u.ph);
$("#theme").textContent=u.mode;$("#lang").textContent="🌐 "+LANGS[lang];$("#foot").textContent=u.foot;document.documentElement.lang=lang}
function chips(){const u=UI[lang],ks=["all",...new Set(DATA.map(d=>d.c))];
$("#chips").innerHTML=ks.map(k=>`<button class="chip" type="button" aria-pressed="${k===active}" data-c="${k}">${esc(k==="all"?u.all:u.cats[k])}</button>`).join("")}
function render(){const u=UI[lang],q=$("#q").value.trim(),ws=norm(q).split(/\s+/).filter(Boolean);
const r=DATA.filter(d=>(active==="all"||d.c===active)&&ws.every(w=>norm([u.cats[d.c],...d.t[lang],d.tags.join(" ")].join(" ")).includes(w)));
$("#count").textContent=q||active!=="all"?u.n.replace("{n}",r.length):"";
$("#list").innerHTML=r.length?r.map(d=>{const[a,b,c]=d.t[lang];return `<li class="item"><h3>${hl(a,q)}</h3><p class="meta">${esc(u.cats[d.c])}${b?" · "+hl(b,q):""}</p><p>${hl(c,q)}</p>${d.link?`<p><a href="${esc(d.link)}" target="_blank" rel="noopener">${esc(u.open)}</a></p>`:""}<div class="tags">${d.tags.map(t=>`<span class="tag">${hl(t,q)}</span>`).join("")}</div></li>`}).join(""):`<li class="empty">${esc(u.empty)}</li>`}
function all(){texts();chips();render()}
$("#lbs").innerHTML=Object.keys(LANGS).map(k=>`<button class="lb" type="button" data-l="${k}">${LANGS[k]}</button>`).join("");
$("#lbs").addEventListener("click",e=>{const b=e.target.closest(".lb");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(x){}$("#pick").hidden=true;all()});
$("#lang").addEventListener("click",()=>{$("#pick").hidden=false});
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;active=b.dataset.c;chips();render()});
$("#q").addEventListener("input",render);
$("#theme").addEventListener("click",()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=d?"light":"dark"});
all();
</script>
</body>
</html>
